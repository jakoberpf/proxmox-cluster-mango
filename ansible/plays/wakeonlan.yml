---
- name: Configure Wake-on-LAN on mango
  hosts: proxmox_nodes
  gather_facts: false

  pre_tasks:
    - name: Require explicit confirmation outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (wakeonlan_confirm | default('')) == 'mango-wol'
        fail_msg: "Preview with --check --diff; apply with -e wakeonlan_confirm=mango-wol."

  roles:
    - role: wakeonlan
