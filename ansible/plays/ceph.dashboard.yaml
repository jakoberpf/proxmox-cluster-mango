---
- name: Configure Ceph
  hosts: development

  tasks:
    - name: Install ceph-mgr-dashboard
      become: yes
      apt:
        update_cache: yes
        pkg:
          - ceph-mgr-dashboard
        state: present
      register: apt_action
      retries: 100
      until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)

    - name: Activate the ceph dashboard manager module
      shell: "ceph mgr module enable dashboard"

    - name: Create self signed certificate
      shell: "ceph dashboard create-self-signed-cert"

    - name: Create administrator user for dashboard
      shell: "echo 'makeitcount' >> cephuserpass && ceph dashboard ac-user-create jakoberpf -i cephuserpass administrator && rm cephuserpass"

    # ceph config set mgr mgr/dashboard/mon.dev/server_addr \*

    - name: iptables -t nat -A PREROUTING -p tcp --dport 8443 -j DNAT --to-destination 192.168.0.135:8443
      shell: iptables -t nat -A PREROUTING -p tcp --dport 8443 -j DNAT --to-destination 192.168.0.135:8443

    - name: iptables -t nat -A POSTROUTING -p tcp -d 10.147.19.60 --dport 8443 -j SNAT --to-source 192.168.0.135
      shell: iptables -t nat -A POSTROUTING -p tcp -d 10.147.19.60 --dport 8443 -j SNAT --to-source 192.168.0.135

    - name: iptables -t nat -A POSTROUTING -j MASQUERADE
      shell: "iptables -t nat -A POSTROUTING -j MASQUERADE"

    # - name: service iptables save
    #   shell: "service iptables save"



