---
- name: Preprare the development machine with basic settings, packages and networking
  hosts: machine

  roles:
    - role: hypervisor/proxmox 
      vars: 
       pve_group: all,
       pve_reboot_on_kernel_update: true

  tasks:
    # - name: Remove Proxmox VE Enterprise Repository
    #   ansible.builtin.lineinfile:
    #     path: /etc/apt/sources.list.d/pve-enterprise.list
    #     regexp: '^deb https://enterprise.proxmox.com/debian/pve bullseye pve-enterprise'
    #     line: "#deb https://enterprise.proxmox.com/debian/pve bullseye pve-enterprise"

    # - name: Add Proxmox VE No-Subscription Repository
    #   ansible.builtin.lineinfile:
    #     path: /etc/apt/sources.list
    #     line: "deb http://download.proxmox.com/debian/pve bullseye pve-no-subscription"
  
    - name: Install basic packages
      become: yes
      apt:
        update_cache: yes
        pkg:
          - git
          - nano
          - htop
          - curl
          - timeshift
        state: present
      register: apt_action
      retries: 100
      until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)

    # https://pve.proxmox.com/wiki/Certificate_Management
