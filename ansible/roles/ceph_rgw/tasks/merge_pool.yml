---
- name: Select current details for {{ mango_rgw_merge_pool }}
  ansible.builtin.set_fact:
    mango_rgw_merge_pool_details: >-
      {{ mango_rgw_pool_details |
         selectattr('pool_name', 'equalto', mango_rgw_merge_pool) | first }}

- name: Refuse to increase PGs in {{ mango_rgw_merge_pool }}
  ansible.builtin.assert:
    that:
      - mango_rgw_merge_pool_details.pg_num | int >= mango_rgw_pg_num

- name: Disable autoscaling for {{ mango_rgw_merge_pool }}
  when: mango_rgw_merge_pool_details.pg_autoscale_mode != 'off'
  ansible.builtin.command: >-
    ceph osd pool set {{ mango_rgw_merge_pool }} pg_autoscale_mode off
  changed_when: true

- name: Merge pool to target PG count | {{ mango_rgw_merge_pool }}
  when: mango_rgw_merge_pool_details.pg_num | int > mango_rgw_pg_num
  ansible.builtin.command: >-
    ceph osd pool set {{ mango_rgw_merge_pool }} pg_num {{ mango_rgw_pg_num }}
  changed_when: true

- name: Wait for clean PGs and completed merge in {{ mango_rgw_merge_pool }}
  ansible.builtin.shell: >-
    set -o pipefail &&
    test "$(ceph osd pool get {{ mango_rgw_merge_pool }} pg_num --format json |
    jq -r '.pg_num')" = "{{ mango_rgw_pg_num }}" &&
    ceph pg dump pgs_brief --format json 2>/dev/null |
    jq -e '[.pg_stats[] | select((.state | startswith("active+clean")) | not)] | length == 0'
  args:
    executable: /bin/bash
  register: mango_rgw_merge_clean
  changed_when: false
  retries: 120
  delay: 5
  until: mango_rgw_merge_clean.rc == 0
