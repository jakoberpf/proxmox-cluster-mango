---
mango_hostname: mango
mango_fqdn: mango.localdomain
mango_timezone: Europe/Berlin

mango_lan_address: 192.168.8.56
mango_lan_prefix: 21
mango_lan_gateway: 192.168.8.1
mango_bridge: vmbr0
mango_bridge_port: enp5s0
mango_unused_interfaces:
  - enp9s0
  - wlp3s0

mango_nested_virtualization: true

mango_base_packages:
  - curl
  - git
  - htop
  - jq
  - nano
  - smartmontools

# RBAC is intentionally not applied yet. The live node currently has only
# root@pam. Stack-specific users, tokens, pools, and ACLs will be added through
# a separately reviewed bootstrap play after the access model is finalized.
mango_manage_rbac: false
